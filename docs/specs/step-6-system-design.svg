      .group-label { fill: #374151; font-size: 14px; font-weight: 600; }
      .node { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .new { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .mock { fill: #fef3c7; stroke: #92400e; stroke-width: 1.5; }
      .name { fill: #111827; font-size: 15px; font-weight: 600; }
      .detail { fill: #374151; font-size: 12px; }
      .edge { fill: none; stroke: #374151; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge2 { fill: none; stroke: #374151; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { fill: #374151; font-size: 12px; font-style: italic; }
      .legend { fill: #374151; font-size: 12px; }
    </style>
  </defs>

