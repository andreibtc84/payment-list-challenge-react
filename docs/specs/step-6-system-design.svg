<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 700" width="1110" height="700" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="title">Step 6 system design</title>
  <desc id="desc">In the browser, main.tsx starts the MSW worker in development, or in the GitHub Pages build, and renders App, which provides the TanStack Query client. App renders PaymentsPage. PaymentsPage reads the applied filters, the Payment ID search and the currency, from usePaymentFilters, which reads the browser URL's ?search= and ?currency= with useSyncExternalStore, keeps a currency only if it is one of the listed codes, writes both with history.pushState from one key list, and follows Back and Forward through popstate. PaymentsPage renders SearchForm, passing onSearch, onCurrencyChange, and onClear only while a filter is applied. SearchForm holds the typed draft and a native currency select named Filter by currency, listing Currencies and every code in CURRENCIES; its value comes from the URL. On submit it calls onSearch; choosing a currency calls onCurrencyChange straight away; Clear Filters calls onClear, which clears both filters in one history entry, and then focuses the search input. All three call setFilters on the hook. PaymentsPage also uses lib/format and the ui components Table, Badge, Skeleton, Button and Input, with the search Input and the currency select sharing one set of field classes, and calls usePayments, a useQuery hook with keepPreviousData, which calls fetchPayments in api/payments, which sends GET /api/payments with page, pageSize, and search and currency only when they are set. When the query fails, PaymentsPage passes the error to getErrorMessage in api/payments, which maps 404 to the Payment not found message, 500 to the Internal server error message, and any other failure to Something went wrong, shown in the always-rendered status region in place of the table. In the browser the MSW service worker answers from the mock handlers, which filter by currency and return 404 for pay_404, 500 for pay_500 and 401 for 401. In tests, Vitest with jsdom in UTC runs a setup file that loads the jest-dom matchers and resets the URL after every test. PaymentsPage.test renders PaymentsPage and drives it with user-event against the MSW Node server, which uses the same mock handlers, and now also checks the currency select, that every row shows the chosen currency, the URL, history and Clear Filters. usePaymentFilters.test tests the hook, including currency parsing and writing, format.test unit-tests lib/format, and payments.test unit-tests getErrorMessage.</desc>
