<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 590" width="1110" height="590" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="title">Step 1 system design</title>
  <desc id="desc">In the browser, main.tsx starts the MSW worker in development, or in the GitHub Pages build where VITE_ENABLE_MOCKS is true, and renders App, which provides the TanStack Query client. App renders PaymentsPage, which uses the formatters and the date check in lib/format, which parses dates with date-fns parseISO and shows anything it cannot parse as raw text, and the Table, Badge and Skeleton components. PaymentsPage calls usePayments, a useQuery hook, which calls fetchPayments, which sends GET /api/payments with axios. In the browser the MSW service worker answers that request from the mock handlers. In tests, Vitest with jsdom in UTC renders PaymentsPage from PaymentsPage.test, the requests are answered by the MSW Node server using the same mock handlers, and format.test unit-tests lib/format.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .group { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .group-label { fill: #374151; font-size: 14px; font-weight: 600; }
      .node { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .mock { fill: #fef3c7; stroke: #92400e; stroke-width: 1.5; }
      .name { fill: #111827; font-size: 15px; font-weight: 600; }
      .detail { fill: #374151; font-size: 12px; }
      .edge { fill: none; stroke: #374151; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-label { fill: #374151; font-size: 12px; font-style: italic; }
    </style>
  </defs>

  <!-- Background, so the diagram reads the same on light and dark pages. -->
  <rect width="1110" height="590" fill="#ffffff"/>

  <!-- Browser -->
  <rect class="group" x="20" y="20" width="1070" height="270" rx="10"/>
  <text class="group-label" x="36" y="44">Browser: Vite dev server, or the GitHub Pages build</text>

  <rect class="node" x="40" y="60" width="190" height="50" rx="6"/>
  <text class="name" x="135" y="81" text-anchor="middle">main.tsx</text>
  <text class="detail" x="135" y="99" text-anchor="middle">starts MSW: dev or Pages build</text>

  <rect class="node" x="250" y="60" width="190" height="50" rx="6"/>
  <text class="name" x="345" y="81" text-anchor="middle">App</text>
  <text class="detail" x="345" y="99" text-anchor="middle">QueryClientProvider</text>

  <rect class="node" x="460" y="60" width="190" height="50" rx="6"/>
  <text class="name" x="555" y="81" text-anchor="middle">PaymentsPage</text>
  <text class="detail" x="555" y="99" text-anchor="middle">table and loading state</text>

  <rect class="node" x="670" y="60" width="190" height="50" rx="6"/>
  <text class="name" x="765" y="81" text-anchor="middle">usePayments</text>
  <text class="detail" x="765" y="99" text-anchor="middle">TanStack useQuery</text>

  <rect class="node" x="880" y="60" width="190" height="50" rx="6"/>
  <text class="name" x="975" y="81" text-anchor="middle">fetchPayments</text>
  <text class="detail" x="975" y="99" text-anchor="middle">axios GET /api/payments</text>

  <rect class="node" x="460" y="190" width="190" height="80" rx="6"/>
  <text class="name" x="555" y="211" text-anchor="middle">lib/format</text>
  <text class="detail" x="555" y="229" text-anchor="middle">formatAmount, formatDate,</text>
  <text class="detail" x="555" y="245" text-anchor="middle">isValidDate: date-fns parseISO,</text>
  <text class="detail" x="555" y="261" text-anchor="middle">bad dates shown as raw text</text>

  <rect class="node" x="670" y="190" width="190" height="50" rx="6"/>
  <text class="name" x="765" y="211" text-anchor="middle">components/ui</text>
  <text class="detail" x="765" y="229" text-anchor="middle">Table, Badge, Skeleton</text>

  <rect class="mock" x="880" y="190" width="190" height="50" rx="6"/>
  <text class="name" x="975" y="211" text-anchor="middle">MSW service worker</text>
  <text class="detail" x="975" y="229" text-anchor="middle">answers in the browser</text>

  <!-- Tests -->
  <rect class="group" x="20" y="340" width="650" height="220" rx="10"/>
  <text class="group-label" x="250" y="364">Tests: Vitest, jsdom, TZ=UTC</text>

  <rect class="node" x="40" y="380" width="190" height="50" rx="6"/>
  <text class="name" x="135" y="401" text-anchor="middle">PaymentsPage.test</text>
  <text class="detail" x="135" y="419" text-anchor="middle">page seam</text>

  <rect class="node" x="460" y="380" width="190" height="50" rx="6"/>
  <text class="name" x="555" y="401" text-anchor="middle">format.test</text>
  <text class="detail" x="555" y="419" text-anchor="middle">unit seam</text>

  <rect class="mock" x="40" y="480" width="190" height="50" rx="6"/>
  <text class="name" x="135" y="501" text-anchor="middle">MSW Node server</text>
  <text class="detail" x="135" y="519" text-anchor="middle">answers in tests</text>

  <!-- Shared mock data -->
  <rect class="mock" x="880" y="480" width="190" height="50" rx="6"/>
  <text class="name" x="975" y="501" text-anchor="middle">mocks/handlers</text>
  <text class="detail" x="975" y="519" text-anchor="middle">mock payment data</text>

  <!-- Runtime edges -->
  <path class="edge" d="M230,85 H248"/>
  <path class="edge" d="M440,85 H458"/>
  <path class="edge" d="M650,85 H668"/>
  <path class="edge" d="M860,85 H878"/>
  <path class="edge" d="M555,110 V188"/>
  <path class="edge" d="M630,110 L700,188"/>
  <path class="edge" d="M975,110 V188"/>
  <text class="edge-label" x="985" y="155">request</text>
  <path class="edge" d="M975,240 V478"/>

  <!-- Test edges -->
  <path class="edge" d="M135,380 V150 H500 V112"/>
  <text class="edge-label" x="300" y="143">renders</text>
  <path class="edge" d="M555,380 V272"/>
  <path class="edge" d="M135,430 V478"/>
  <path class="edge" d="M230,505 H878"/>
</svg>
